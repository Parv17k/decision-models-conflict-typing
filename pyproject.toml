[project]
name = "dmconflict"
version = "0.1.0"
description = "Typed decision models as knowledge-conflict classifiers on the CONFLICTS benchmark"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
dmconflict = "dmconflict.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmconflict"]

[tool.pytest.ini_options]
pythonpath = ["src"]
