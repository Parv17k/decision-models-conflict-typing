[project]
name = "jevconflict"
version = "0.1.0"
description = "Typed decision models (Jev, Laya) as conflict-type classifiers on the CONFLICTS benchmark"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
jevconflict = "jevconflict.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevconflict"]

[tool.pytest.ini_options]
pythonpath = ["src"]
